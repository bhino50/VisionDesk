name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out source and reachable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version
      - name: Shared tests
        run: swift test
      - name: Mac behavior checks
        run: ./script/test_mac_behavior.sh
      - name: Startup checks
        run: ./script/test_startup.sh
      - name: Packaging and privacy regressions
        run: |
          python3 script/test_app_bundle.py
          python3 script/test_release_archive.py
          python3 script/test_release_privacy.py
          python3 script/test_repository_privacy.py
          python3 script/test_mac_dmg.py
      - name: Inspect source and repository history
        run: |
          python3 script/verify_release_privacy.py --source .
          python3 script/verify_repository.py --source .
      - name: Build visionOS simulator app
        run: ./script/build_vision.sh simulator
